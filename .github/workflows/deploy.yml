name: Deploy to GitHub Pages

on:
  # Запускаем деплой при пуше в ветки main или master
  push:
    branches: ["main", "master"]
  # Позволяет запускать workflow вручную из вкладки Actions
  workflow_dispatch:

# Устанавливаем права доступа для GITHUB_TOKEN, чтобы можно было деплоить на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Управляем параллельными запусками: отменяем старые сборки, если пушится новый коммит
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем папку dist (результат сборки Vite)
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
